allowBuilds:
  "@google/genai": false
  protobufjs: false
  esbuild: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  vite-plus: 1.1.0
minimumReleaseAgeExclude:
  - openai@7.30.1
  - effect@4.0.2
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
